# Prospecção v2. Ambas fazem a autorização à mão (sessão de admin ou chave
# secreta do projeto), por isso verify_jwt = false.

[functions.prospect-source]
enabled = true
verify_jwt = false
import_map = "./functions/prospect-source/deno.json"
entrypoint = "./functions/prospect-source/index.ts"

[functions.prospect-worker]
enabled = true
verify_jwt = false
import_map = "./functions/prospect-worker/deno.json"
entrypoint = "./functions/prospect-worker/index.ts"
